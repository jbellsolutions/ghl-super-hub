name: Verify toolkit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash install.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python scripts/build_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghl-super-hub-${{ matrix.os }}
          path: dist/ghl-super-hub.zip
